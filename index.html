<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b50" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1411" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="리셋 홈트">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
</head>
<body>
<title>리셋 홈트 플래너</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 휴대폰 앱처럼 760px 단일 컬럼 + 하단 탭바. 숫자는 Black Han Sans, 본문은 IBM Plex Sans KR */
:root{
  --bg:#edf2ef; --surface:#ffffff; --surface-2:#e2eae5; --ink:#14221c; --muted:#59695f; --line:#cbd8d0;
  --accent:#0f6b50; --accent-soft:#d5ebe1; --accent-ink:#ffffff;
  --cardio:#cf5a24; --strength:#2d5bcc; --flex:#23865f; --rest:#7f8c85;
  --warn-bg:#fff1d9; --warn-ink:#6f4300; --alert:#b3261e; --good:#1c7a4c;
  --fig:#14221c; --fig-far:#a2b3aa; --prop:#c9d5ce; --water:#5aa9e6;
  --f-display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1411; --surface:#15201b; --surface-2:#1d2a24; --ink:#e3ece7; --muted:#95a79e; --line:#2a3a33;
  --accent:#3ec393; --accent-soft:#183a2e; --accent-ink:#04201a;
  --cardio:#f08a52; --strength:#86a2ff; --flex:#4cc79d; --rest:#6f7d76;
  --warn-bg:#3a2a0d; --warn-ink:#ffd38c; --alert:#ff8a80; --good:#5fd39a;
  --fig:#e3ece7; --fig-far:#53655c; --prop:#34463e; --water:#4b8fc4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1411; --surface:#15201b; --surface-2:#1d2a24; --ink:#e3ece7; --muted:#95a79e; --line:#2a3a33;
  --accent:#3ec393; --accent-soft:#183a2e; --accent-ink:#04201a;
  --cardio:#f08a52; --strength:#86a2ff; --flex:#4cc79d; --rest:#6f7d76;
  --warn-bg:#3a2a0d; --warn-ink:#ffd38c; --alert:#ff8a80; --good:#5fd39a;
  --fig:#e3ece7; --fig-far:#53655c; --prop:#34463e; --water:#4b8fc4; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:760px;margin:0 auto;padding-block:14px 110px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:.01em}
h3{font-size:16px;font-weight:700}
p{margin:0}
.num{font-family:var(--f-display);font-weight:400;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:28px;line-height:1;color:var(--accent)}
.brand span{color:var(--ink);font-size:17px;margin-left:6px;font-family:var(--f-body);font-weight:700}
.chip-who{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{background:transparent;border:none;padding:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}

/* 목표 설정 */
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.form input,.form select{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:15px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.form .wide{grid-column:span 2}
@media (max-width:560px){.form{grid-template-columns:repeat(2,1fr)}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* 목표 요약 */
.goalhero{display:grid;grid-template-columns:1.2fr 1fr;gap:14px;align-items:center}
@media (max-width:560px){.goalhero{grid-template-columns:1fr}}
.goalnum{font-size:44px;line-height:1;color:var(--accent)}
.goalnum small{font-size:18px;color:var(--ink);margin-left:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-weight:400;font-size:21px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.alert{background:color-mix(in srgb,var(--alert) 15%,transparent);color:var(--alert)}
.pill.warn{background:var(--warn-bg);color:var(--warn-ink)}
.pill.ok{background:var(--accent-soft);color:var(--good)}
.notice{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.notice b{font-weight:700}

/* 진행 바 */
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .4s}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring>div{width:72px;height:72px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1.1}
.ring b{font-family:var(--f-display);font-weight:400;font-size:22px}
.ring span{font-size:11px;color:var(--muted)}

/* 단계 타임라인 */
.timeline{display:flex;gap:3px}
.timeline button{flex:1;height:30px;border:none;border-radius:6px;cursor:pointer;padding:0;position:relative;font-size:11px;font-variant-numeric:tabular-nums;color:var(--ink)}
.timeline button.p0{background:color-mix(in srgb,var(--accent) 18%,var(--surface))}
.timeline button.p1{background:color-mix(in srgb,var(--accent) 38%,var(--surface))}
.timeline button.p2{background:color-mix(in srgb,var(--accent) 62%,var(--surface));color:var(--accent-ink)}
.timeline button.p3{background:var(--accent);color:var(--accent-ink)}
.timeline button.sel{outline:3px solid var(--ink);outline-offset:1px}
.timeline button.now::after{content:"";position:absolute;left:50%;bottom:-8px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--cardio)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* 주간 계획 */
.wknav{display:flex;align-items:center;gap:10px}
.wknav button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px}
.wknav button:disabled{opacity:.35;cursor:default}
.wknav .lbl{flex:1;min-width:0}
.wknav .lbl b{font-family:var(--f-display);font-weight:400;font-size:24px}
.phasebox{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.days{display:flex;flex-direction:column;gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.day.done .dhead .dname::after{content:" ✓ 완료";color:var(--good);font-size:13px;font-weight:700}
.dhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dname{font-weight:700;font-size:16px}
.dow{font-family:var(--f-display);font-size:22px;line-height:1;width:30px}
.type{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;border:1.5px solid currentColor}
.t-S{color:var(--strength)} .t-A,.t-L{color:var(--cardio)} .t-R{color:var(--flex)} .t-X{color:var(--rest)}
.dprog{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tasks li{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed var(--line)}
.tasks li:first-child{border-top:none}
.chk{position:relative;flex:none;width:24px;height:24px;cursor:pointer}
.chk input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.chk .box{position:absolute;inset:0;border:2px solid var(--line);border-radius:7px;background:var(--bg);display:grid;place-items:center;transition:.15s}
.chk input:checked+.box{background:var(--accent);border-color:var(--accent)}
.chk input:checked+.box::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk input:focus-visible+.box{outline:3px solid var(--accent);outline-offset:2px}
.tname{flex:1;min-width:0;display:flex;flex-direction:column}
.exlink{background:none;border:none;padding:0;text-align:left;cursor:pointer;font-weight:500;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.exlink:hover{text-decoration-color:var(--accent)}
.dose{font-size:13px;color:var(--muted)}
li.checked .exlink,li.checked .plain{color:var(--muted);text-decoration:line-through}
.play{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer}

/* 오늘 카드 */
.todayhead{display:flex;gap:14px;align-items:center}
.streak{display:flex;gap:6px;flex-wrap:wrap}
.streak span{width:26px;height:26px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-size:11px;font-variant-numeric:tabular-nums;color:var(--muted)}
.streak span.full{background:var(--accent);color:var(--accent-ink)}
.streak span.part{background:var(--accent-soft);color:var(--good)}
.streak span.td{outline:2px solid var(--cardio)}

/* 운동 라이브러리 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.move{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.move .stage{background:var(--surface-2);aspect-ratio:200/150;max-width:100%}
.move .stage svg{width:100%;height:100%;display:block}
.move .body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.move .acts{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;padding:8px 12px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.yt{background:#c4302b;border-color:#c4302b;color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;flex:1}
.cat{font-size:11px;font-weight:700;letter-spacing:.04em}
.c-cardio{color:var(--cardio)} .c-strength{color:var(--strength)} .c-flex{color:var(--flex)}

/* 식단 */
.kcal{font-size:48px;line-height:1;color:var(--accent)}
.macros{display:flex;flex-direction:column;gap:8px}
.macro{display:grid;grid-template-columns:70px 1fr 90px;gap:10px;align-items:center;font-size:14px}
.macro .bar i{background:var(--c)}
.plate{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.plate svg{width:130px;height:130px;flex:none}
.meals{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:560px){.meals{grid-template-columns:1fr}}
.meal{background:var(--surface-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.seg.sm button{padding:4px 10px;font-size:13px}
.seg .excl[aria-pressed="true"]{background:var(--alert);border-color:var(--alert);color:#fff;text-decoration:line-through}
.optrow{display:flex;flex-direction:column;gap:6px}
.optrow>span{font-size:12px;color:var(--muted)}
.meal .mhead{display:flex;align-items:center;gap:8px}
.meal .mhead b{flex:1;min-width:0}
.meal .mk{font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums}
.meal.ate{opacity:.55}
.mlitems{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:14px}
.mlitems li{display:flex;justify-content:space-between;gap:10px}
.mlitems li span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.mfoot{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:13px}
.mfoot .btn{margin-left:auto;padding:4px 10px;font-size:13px}

/* 기록 */
.chartwrap{overflow-x:auto}
.chartwrap svg{width:100%;min-width:300px;height:auto;display:block}
.logform{display:flex;gap:8px;flex-wrap:wrap}
.logform input{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:15px;min-width:0;flex:1}
.loglist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.loglist li{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.loglist button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:10px 0}

/* 하단 탭 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabbar .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabbar button{background:none;border:none;border-radius:10px;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}

/* 동작 시트 */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(5,12,9,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:640px){.sheet{align-items:center}.sheet .panel{border-radius:18px}}
.sheet .stage{background:var(--surface-2);border-radius:12px;aspect-ratio:200/150;max-width:100%}
.sheet .stage svg{width:100%;height:100%;display:block}
.sheet ol,.sheet ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.x{border:none;background:var(--surface-2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;flex:none}

/* 그림 */
.ground{stroke:var(--line);stroke-width:2}
.prop{fill:var(--prop)}
.propl{stroke:var(--prop);stroke-width:5;fill:none;stroke-linecap:round}
.mat{fill:var(--accent);opacity:.35}
.water{fill:var(--water);opacity:.3}
.limb{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:8}
.near{stroke:var(--fig)} .far{stroke:var(--fig-far)}
.torso{stroke:var(--fig);stroke-width:12;stroke-linecap:round}
.headc{fill:var(--fig)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">리셋<span>홈트 플래너</span></div>
    <div class="chip-who" id="who"></div>
  </header>

  <!-- ===== 계획 탭 ===== -->
  <section id="tab-plan" class="tabpane" style="display:flex;flex-direction:column;gap:16px">

    <div class="card" id="todayCard"></div>

    <div class="card">
      <div class="row between"><h2>내 목표</h2><span class="muted small">입력하면 바로 계획이 바뀌어요</span></div>
      <div class="form">
        <label>현재 몸무게(kg)<input id="inW" type="number" inputmode="decimal" min="40" max="300" step="0.1"></label>
        <label>키(cm)<input id="inH" type="number" inputmode="decimal" min="120" max="230"></label>
        <label>나이<input id="inA" type="number" inputmode="numeric" min="15" max="90"></label>
        <label>성별<select id="inSex"><option value="m">남성</option><option value="f">여성</option></select></label>
        <label>목표 감량(kg)<input id="inGoal" type="number" inputmode="decimal" min="1" max="60" step="0.5"></label>
        <label>기간(주)<input id="inWeeks" type="number" inputmode="numeric" min="2" max="52"></label>
        <label class="wide">시작일<input id="inStart" type="date"></label>
      </div>
      <div class="seg" id="weekChips" aria-label="기간 빠른 선택">
        <button data-w="4">1달</button><button data-w="8">2달</button><button data-w="12">3달</button><button data-w="16">4달</button><button data-w="24">6달</button>
      </div>
    </div>

    <div class="card" id="goalCard"></div>
    <div id="safety"></div>

    <div class="card">
      <div class="row between"><h2>요일별 운동 계획</h2><span class="muted small">운동 이름을 누르면 동작 애니메이션</span></div>
      <div class="timeline" id="timeline"></div>
      <div class="legend" id="legend"></div>
      <div class="wknav">
        <button id="prevW" aria-label="이전 주">‹</button>
        <div class="lbl"><b id="wkLabel"></b> <span class="muted" id="wkOf"></span><div class="small muted" id="wkRange"></div></div>
        <button id="nextW" aria-label="다음 주">›</button>
      </div>
      <div class="phasebox" id="phaseBox"></div>
      <div class="row between small"><span class="muted">이번 주 달성률</span><span id="wkPct" class="num"></span></div>
      <div class="bar"><i id="wkBar"></i></div>
      <div class="days" id="days"></div>
    </div>
  </section>

  <!-- ===== 운동 탭 ===== -->
  <section id="tab-moves" class="tabpane" hidden style="flex-direction:column;gap:16px">
    <div class="card flat"><h2>홈트 동작 모음</h2><p class="muted small">모두 집에서, 점프 없이 관절 부담이 적은 동작이에요. 애니메이션으로 자세를 보고, 유튜브에서 실제 영상을 찾아볼 수 있어요.</p></div>
    <div class="seg" id="catChips">

  if(P.sDays.length===2&&dow===3)return 'R';

  const N=S.weeks,pi=phaseOf(week,N),P=PHASES[pi],R=phaseRanges(N)[pi];
  const prog=R.e>R.s?(week-R.s)/(R.e-R.s):0;
  const min=Math.round((P.min[0]+(P.min[1]-P.min[0])*prog)/5)*5;
  const start=addDays(parseISO(S.start),(week-1)*7);
  const days=[];let ci=0;
  for(let i=0;i<7;i++){
    const date=addDays(start,i),dow=date.getDay(),type=dayType(dow,P);
    const cEx=P.cardio[ci%P.cardio.length];
    const cDose=m=>P.interval?`${m}분 · 빠르게 1분 + 보통 2분 반복`:(pi===0?`${m}분 · 10분씩 나눠도 OK`:`${m}분`);
    let tasks=[];
    if(type==='S'){
      tasks.push({ex:'march',dose:'준비운동 5분',min:5});
      P.strength.forEach(id=>tasks.push({ex:id,dose:DOSE_OVR[id]||P.sets,min:4}));
      const m=Math.max(10,Math.round(min/2/5)*5);tasks.push({ex:cEx,dose:`${m}분`,min:m});ci++;
    }else if(type==='A'){
      tasks.push({ex:cEx,dose:cDose(min),min});ci++;
      tasks.push({ex:'stretch',dose:'마무리 5분',min:5});
    }else if(type==='L'){
      tasks.push({ex:'walk',dose:`${min+15}분 · 천천히 길게 (밖이 어려우면 제자리 걷기)`,min:min+15,alt:'march'});
      tasks.push({ex:'arm-raise',dose:'10회 × 2세트',min:3});
      tasks.push({ex:'stretch',dose:'마무리 5분',min:5});
    }else if(type==='R'){
      tasks.push({ex:'march',dose:`가볍게 ${Math.max(15,min-10)}분`,min:Math.max(15,min-10)});
      tasks.push({ex:'arm-raise',dose:'10회 × 2세트',min:3});
      tasks.push({ex:'stretch',dose:'10분',min:10});
    }else{
      tasks.push({ex:null,label:'푹 쉬기 · 7시간 이상 자기',min:0});
      tasks.push({ex:'stretch',dose:'원하면 10분',min:10});
    }
    days.push({date,dow,type,tasks,idx:i});
  }
  return {week,phase:pi,P,days,min};
}
const key=(w,i,j)=>`${S.start}|${w}-${i}-${j}`;
function dayDone(w,d){const n=d.tasks.length;let c=0;d.tasks.forEach((t,j)=>{if(checks[key(w,d.idx,j)])c++});return [c,n]}

/* ---------- 계산 ---------- */
function calc(){
  const {w,h,a,sex,goal,weeks}=S;
  const bmi=w/((h/100)**2);
  const bmr=10*w+6.25*h-5*a+(sex==='m'?5:-161);
  const tdee=bmr*1.2;
  /* 계획 운동 소모량(주 평균, 하루 기준). 체중 반영 */
  let wk=0;for(let k=1;k<=weeks;k++){weekPlan(k).days.forEach(d=>d.tasks.forEach(t=>{if(t.ex)wk+=t.min*EX[t.ex].kcal*(w/100)}))}
  const exDay=wk/weeks/7;
  const needDef=goal*7700/(weeks*7);
  const floor=sex==='m'?1500:1200;
  const rawTarget=tdee+exDay-needDef;
  const target=Math.max(floor,Math.round(rawTarget/50)*50);
  const realDef=tdee+exDay-target;
  const expected=Math.min(goal,realDef*weeks*7/7700);
  const weekly=goal/weeks;
  const pctWeek=weekly/w*100;
  const ibw=(sex==='m'?50:45.5)+0.9*(h-152.4);
  const abw=w>ibw*1.2?ibw+0.4*(w-ibw):w;
  const prot=[Math.round(abw*1.2/5)*5,Math.round(abw*1.5/5)*5];
  let level,levelTxt;
  if(pctWeek<=0.8){level='ok';levelTxt='무리 없는 목표'}
  else if(pctWeek<=1.1){level='warn';levelTxt='도전적이지만 가능'}
  else{level='alert';levelTxt='너무 빠른 목표'}
  return {bmi,bmr,tdee,exDay,needDef,target,floor,clamped:rawTarget<floor,expected,weekly,pctWeek,prot,level,levelTxt};
}
function bmiClass(b){if(b<18.5)return['저체중','ok'];if(b<23)return['정상','ok'];if(b<25)return['비만 전단계','warn'];if(b<30)return['1단계 비만','warn'];if(b<35)return['2단계 비만','alert'];return['3단계 비만(고도비만)','alert']}
function curWeek(){return Math.floor(dayDiff(parseISO(S.start),today())/7)+1}

/* ---------- 사람 그림 (관절 각도 애니메이션) ---------- */
const D=Math.PI/180,LEN={torso:50,ua:28,fa:26,th:34,sh:34};
const seg=(p,a,l)=>[p[0]+l*Math.sin(a*D),p[1]+l*Math.cos(a*D)];
function ik(hip,foot){let dx=foot[0]-hip[0],dy=foot[1]-hip[1],d=Math.hypot(dx,dy);const mx=LEN.th+LEN.sh-.01;
  if(d>mx){foot=[hip[0]+dx/d*mx,hip[1]+dy/d*mx];dx=foot[0]-hip[0];dy=foot[1]-hip[1];d=mx}
  const h=Math.sqrt(Math.max(0,LEN.th**2-(d/2)**2));return [[hip[0]+dx/2+dy/d*h,hip[1]+dy/2-dx/d*h],foot]}
function toe(an,floors){for(const f of floors){const h=f-an[1];if(h>=-1.5&&h<10)return [an[0]+Math.sqrt(Math.max(0,100-h*h)),f]}return [an[0]+9,an[1]+3]}
function solve(p,floors){
  const hip=[p.x,p.y],tr=p.t*D,neck=[hip[0]+LEN.torso*Math.sin(tr),hip[1]-LEN.torso*Math.cos(tr)],head=[neck[0]+14*Math.sin(tr),neck[1]-14*Math.cos(tr)];
  const arm=a=>{const e=seg(neck,a[0],LEN.ua);return [neck,e,seg(e,a[1],LEN.fa)]};
  const leg=(ang,foot)=>{let k,an;if(foot){[k,an]=ik(hip,foot)}else{k=seg(hip,ang[0],LEN.th);an=seg(k,ang[1],LEN.sh)}return [hip,k,an,toe(an,floors)]};
  return {hip,neck,head,la:arm(p.la),ra:arm(p.ra),ll:leg(p.ll,p.lf),rl:leg(p.rl,p.rf)};
}
function lerp(a,b,e){const o={};for(const k in a){o[k]=Array.isArray(a[k])?a[k].map((v,i)=>v+(b[k][i]-v)*e):a[k]+(b[k]-a[k])*e}return o}
function poseAt(ex,t){const A=ex.anim,n=A.keys.length,sd=A.dur/n,tt=((t%A.dur)+A.dur)%A.dur,i=Math.floor(tt/sd),f=(tt-i*sd)/sd;return lerp(A.keys[i],A.keys[(i+1)%n],(1-Math.cos(Math.PI*f))/2)}
function chair(x,y,flip){const bx=flip?x+29:x;return `<g class="prop"><rect x="${x}" y="${y}" width="34" height="5" rx="2"/><rect x="${bx}" y="${y-44}" width="5" height="44" rx="2"/><rect x="${x}" y="${y+5}" width="4" height="${165-y}"/><rect x="${x+30}" y="${y+5}" width="4" height="${165-y}"/></g>`}
function propSVG(p){switch(p){
  case 'chairS':return chair(66,140);
  case 'chairQ':return chair(50,140);
  case 'chairF':return chair(140,128,true);
  case 'wall':return `<rect class="prop" x="193" y="24" width="7" height="146"/>`;
  case 'step':return `<rect class="prop" x="114" y="150" width="44" height="20" rx="2"/>`;
  case 'mat':return `<rect class="mat" x="24" y="169" width="166" height="4" rx="2"/>`;
  default:return ''}}
const NS='http://www.w3.org/2000/svg';
function makeFig(id){
  const ex=EX[id];
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 12 200 166');svg.setAttribute('role','img');svg.setAttribute('aria-label',ex.name+' 동작 애니메이션');
  svg.innerHTML=`<line class="ground" x1="8" y1="171" x2="192" y2="171"/>${propSVG(ex.prop)}
   <path class="limb far" data-p="ra"/><path class="limb far" data-p="rl"/>
   <line class="torso" data-p="torso"/><circle class="headc" r="11" data-p="head"/>
   <path class="limb near" data-p="ll"/><path class="limb near" data-p="la"/>`;
  const parts={};svg.querySelectorAll('[data-p]').forEach(e=>parts[e.dataset.p]=e);
  const f={svg,ex,parts,floors:ex.anim.floors||[170],playing:!reduced,t0:Math.random()*-2000,still:ex.anim.dur*0.5/ex.anim.keys.length*1};
  figs.add(f);drawFig(f,poseAt(ex,f.still));return f;
}
const P2=p=>p[0].toFixed(1)+' '+p[1].toFixed(1);
const path=a=>'M'+a.map(P2).join(' L');
function drawFig(f,pose){const s=solve(pose,f.floors),P=f.parts;
  P.ra.setAttribute('d',path(s.ra));P.rl.setAttribute('d',path(s.rl));P.ll.setAttribute('d',path(s.ll));P.la.setAttribute('d',path(s.la));
  P.torso.setAttribute('x1',s.hip[0]);P.torso.setAttribute('y1',s.hip[1]);P.torso.setAttribute('x2',s.neck[0]);P.torso.setAttribute('y2',s.neck[1]);
  P.head.setAttribute('cx',s.head[0]);P.head.setAttribute('cy',s.head[1])}
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const figs=new Set();
function tick(now){for(const f of figs){if(!f.svg.isConnected){figs.delete(f);continue}if(!f.playing)continue;if(f.svg.closest('[hidden]'))continue;drawFig(f,poseAt(f.ex,now+f.t0))}requestAnimationFrame(tick)}
requestAnimationFrame(tick);

function renderToday(){

  const st=parseISO(S.start),td=today();
  if(cw<1){el.innerHTML=`<div class="row between"><h2>시작까지 D-${dayDiff(td,st)}</h2></div><p class="muted">${st.getMonth()+1}월 ${st.getDate()}일부터 계획이 시작돼요. 그 전엔 가볍게 매일 15분 걷기로 몸을 풀어두세요.</p>`;return}
  if(cw>N){el.innerHTML=`<h2>계획 기간이 끝났어요 🎉</h2><p class="muted">기록 탭에서 결과를 확인하고, 시작일을 오늘로 바꿔 다음 목표를 세워보세요.</p>`;return}
  const plan=weekPlan(cw),d=plan.days.find(x=>iso(x.date)===iso(td));
  // 전체 달성률
  let tot=0,done=0;for(let w=1;w<=Math.min(cw,N);w++){weekPlan(w).days.forEach(dd=>{if(dd.date>td)return;const [c,n]=dayDone(w,dd);tot+=n;done+=c})}
  const pct=tot?Math.round(done/tot*100):0;
  // 최근 14일
  let cells='';for(let k=13;k>=0;k--){const dt=addDays(td,-k);const off=dayDiff(st,dt);if(off<0||off>=N*7){cells+=`<span title="${fmtD(dt)}">·</span>`;continue}
    const w=Math.floor(off/7)+1,dd=weekPlan(w).days[off%7],[c,n]=dayDone(w,dd);
    cells+=`<span class="${c===n?'full':c?'part':''} ${k===0?'td':''}" title="${fmtD(dt)} ${c}/${n}">${dt.getDate()}</span>`}
  const [c,n]=dayDone(cw,d);
  el.innerHTML=`<div class="todayhead"><div class="ring" style="--p:${pct}"><div><div><b>${pct}%</b><br><span>전체 달성</span></div></div></div>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px"><h2>오늘 · ${td.getMonth()+1}/${td.getDate()} ${DOW[td.getDay()]}요일</h2>
    <div class="row"><span class="type t-${d.type}">${TYPE_NAME[d.type]}</span><span class="small muted">${cw}주차 · ${PHASES[plan.phase].name}</span></div>
    <div class="streak" aria-label="최근 14일 달성">${cells}</div></div></div>
    ${taskList(cw,d)}
    <div class="small muted">${c===n?'오늘 운동을 모두 끝냈어요. 수고했어요!':`남은 항목 ${n-c}개 · 체크하면 자동 저장돼요`}</div>`;
}
function taskList(w,d){
  return `<ul class="tasks">${d.tasks.map((t,j)=>{const k=key(w,d.idx,j),on=!!checks[k];
    const name=t.ex?`<button class="exlink" data-ex="${t.ex}">${EX[t.ex].name}</button>`:`<span class="plain">${t.label}</span>`;
    return `<li class="${on?'checked':''}"><label class="chk"><input type="checkbox" data-k="${k}" ${on?'checked':''} aria-label="${t.ex?EX[t.ex].name:t.label} 완료"><span class="box"></span></label>
      <div class="tname">${name}${t.dose?`<span class="dose">${t.dose}</span>`:''}</div>${t.ex?`<button class="play" data-ex="${t.ex}" aria-label="${EX[t.ex].name} 동작 보기">▶ 동작</button>`:''}</li>`}).join('')}</ul>`;

function renderLog(){

  const st=parseISO(S.start),N=S.weeks,W=S.w,G=S.w-S.goal;
  const pts=logs.map(l=>({x:dayDiff(st,parseISO(l.d))/7,y:l.kg,d:l.d})).filter(p=>p.x>=-1);
  const lo=k=>W*Math.pow(1-0.009,k),hi=k=>W*Math.pow(1-0.005,k);

  const step=(y1-y0)>16?4:2;y0=Math.floor(y0/step)*step;y1=Math.ceil(y1/step)*step;
  const w=600,h=270,l=44,r=14,t=12,b=30,X=x=>l+(x/N)*(w-l-r),Y=y=>t+(y1-y)/(y1-y0)*(h-t-b);

  const xs=N<=8?1:N<=16?2:4;for(let k=0;k<=N;k+=xs)g+=`<text x="${X(k)}" y="${h-10}" text-anchor="middle" font-size="12" fill="var(--muted)">${k}주</text>`;
  let band='M';for(let k=0;k<=N;k++)band+=`${X(k)} ${Y(hi(k))} L`;for(let k=N;k>=0;k--)band+=`${X(k)} ${Y(lo(k))} ${k?'L':'Z'}`;
  const cwk=dayDiff(st,today())/7;
  const nowLine=cwk>=0&&cwk<=N?`<line x1="${X(cwk)}" x2="${X(cwk)}" y1="${t}" y2="${h-b}" stroke="var(--muted)" stroke-dasharray="3 4"/><text x="${X(cwk)+4}" y="${t+12}" font-size="11" fill="var(--muted)">오늘</text>`:'';
  const pl=pts.length?`<polyline points="${pts.map(p=>X(Math.max(0,p.x))+','+Y(p.y)).join(' ')}" fill="none" stroke="var(--cardio)" stroke-width="2.5"/>`+pts.map(p=>`<circle cx="${X(Math.max(0,p.x))}" cy="${Y(p.y)}" r="4.5" fill="var(--cardio)" stroke="var(--surface)" stroke-width="2"/>`).join(''):'';
  $('#chart').innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="목표 체중선과 기록">${g}
    <path d="${band}" fill="var(--surface-2)" stroke="none" opacity=".9"/>
    <line x1="${X(0)}" y1="${Y(W)}" x2="${X(N)}" y2="${Y(G)}" stroke="var(--accent)" stroke-width="2.5"/>
    <circle cx="${X(0)}" cy="${Y(W)}" r="5" fill="var(--accent)"/><circle cx="${X(N)}" cy="${Y(G)}" r="5" fill="var(--accent)"/>
    <text x="${X(N)-6}" y="${Y(G)-10}" text-anchor="end" font-size="12" font-weight="700" fill="var(--accent)">목표 ${fmt(G,1).replace(/\.0$/,'')}kg</text>
    ${nowLine}${pl}</svg>`;
  const last=logs[logs.length-1];
  if(last){const lost=W-last.kg,need=S.goal,pr=clamp(lost/need*100,0,100);
    $('#logSummary').textContent=`시작 ${W}kg → 최근 ${last.kg}kg (${lost>=0?'-':'+'}${fmt(Math.abs(lost),1)}kg · 목표의 ${Math.round(pr)}%)`;}
  else $('#logSummary').textContent=`시작 ${W}kg · 첫 기록을 남겨보세요`;
  $('#logList').innerHTML=logs.length?logs.slice().reverse().map(l=>{const dv=l.kg-W;return `<li><span>${l.d.slice(5).replace('-','/')}</span><b class="num" style="font-size:16px">${l.kg}kg</b><span class="small" style="color:${dv<=0?'var(--good)':'var(--alert)'}">${dv<=0?'-':'+'}${fmt(Math.abs(dv),1)}</span><button data-del="${l.d}" aria-label="${l.d} 기록 삭제">삭제</button></li>`}).join(''):'<li class="empty">아직 기록이 없어요. 위에서 오늘 몸무게를 입력해 보세요.</li>';
}

/* ---------- 동작 시트 ---------- */
let sheetFig=null,lastFocus=null;
function openSheet(id){
  const e=EX[id];lastFocus=document.activeElement;
  const p=$('#shPanel');
  p.innerHTML=`<div class="row between" style="flex-wrap:nowrap"><div><span class="cat c-${e.cat}">${{cardio:'유산소',strength:'근력',flex:'스트레칭'}[e.cat]} · ${e.target}</span><h2 id="shTitle">${e.name}</h2></div><button class="x" id="shClose" aria-label="닫기">×</button></div>
   <div class="stage" id="shStage"></div>
   <div class="row"><button class="btn" id="shPlay"></button><a class="btn yt" href="${ytURL(e.yt)}" target="_blank" rel="noopener">▶ 유튜브에서 영상 보기</a></div>
   <h3>이렇게 하세요</h3><ol>${e.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
   <h3>주의할 점</h3><ul>${e.caution.map(s=>`<li>${s}</li>`).join('')}</ul>
   <p class="small muted">유튜브 버튼은 "${esc(e.yt)}" 검색 결과로 연결돼요. 조회수 많고 자막 있는 영상을 고르세요.</p>`;
  sheetFig=makeFig(id);sheetFig.playing=true;sheetFig.t0=0;$('#shStage').appendChild(sheetFig.svg);
  const pb=$('#shPlay');const upd=()=>pb.textContent=sheetFig.playing?'❚❚ 멈춤':'▶ 재생';upd();
  pb.onclick=()=>{sheetFig.playing=!sheetFig.playing;upd()};
  $('#shClose').onclick=closeSheet;
  $('#sheet').hidden=false;$('#shClose').focus();
}
function closeSheet(){$('#sheet').hidden=true;$('#shPanel').innerHTML='';sheetFig=null;if(lastFocus)lastFocus.focus()}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

/* ---------- 이벤트 ---------- */
document.addEventListener('click',e=>{
  const ex=e.target.closest('[data-ex]');if(ex){openSheet(ex.dataset.ex);return}
  const tw=e.target.closest('#timeline button');if(tw){selWeek=+tw.dataset.w;renderWeek();return}
  const del=e.target.closest('[data-del]');if(del){logs=logs.filter(l=>l.d!==del.dataset.del);store.set('rp.logs',logs);renderLog();return}
});
document.addEventListener('change',e=>{
  const k=e.target.dataset&&e.target.dataset.k;if(!k)return;
  if(e.target.checked)checks[k]=1;else delete checks[k];store.set('rp.checks',checks);
  renderToday();renderWeek();
});
$('#prevW').onclick=()=>{selWeek--;renderWeek()};$('#nextW').onclick=()=>{selWeek++;renderWeek()};

const inputs={inW:['w',40,300],inH:['h',120,230],inA:['a',15,90],inGoal:['goal',1,60],inWeeks:['weeks',2,52]};
function fillForm(){for(const id in inputs)$('#'+id).value=S[inputs[id][0]];$('#inSex').value=S.sex;$('#inStart').value=S.start;
  document.querySelectorAll('#weekChips button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.w===S.weeks))}
function onSettings(){
  for(const id in inputs){const [k,a,b]=inputs[id],v=parseFloat($('#'+id).value);if(!isNaN(v))S[k]=clamp(k==='weeks'?Math.round(v):v,a,b)}
  S.sex=$('#inSex').value;if($('#inStart').value)S.start=$('#inStart').value;
  store.set('rp.settings',S);selWeek=null;
  document.querySelectorAll('#weekChips button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.w===S.weeks));
  renderAll(false);
}
['inW','inH','inA','inGoal','inWeeks','inSex','inStart'].forEach(id=>$('#'+id).addEventListener('change',onSettings));
$('#weekChips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$('#inWeeks').value=b.dataset.w;onSettings()});
$('#catChips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c;document.querySelectorAll('#catChips button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderMoves()});
$('#logDate').value=iso(today());
$('#logForm').addEventListener('submit',e=>{e.preventDefault();const d=$('#logDate').value,kg=parseFloat($('#logKg').value);
  if(!d||isNaN(kg)||kg<40||kg>300){$('#logMsg').textContent='날짜와 몸무게(40~300kg)를 입력해 주세요.';return}
  logs=logs.filter(l=>l.d!==d);logs.push({d,kg:Math.round(kg*10)/10});store.set('rp.logs',logs);$('#logKg').value='';
  const lost=S.w-kg;$('#logMsg').textContent=lost>0?`기록했어요. 시작보다 ${fmt(lost,1)}kg 빠졌어요!`:'기록했어요. 꾸준히 하면 반드시 내려가요.';renderLog()});

function showTab(t){document.querySelectorAll('.tabpane').forEach(p=>{const on=p.id==='tab-'+t;p.hidden=!on;if(on)p.style.display='flex'});
  document.querySelectorAll('.tabbar button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));store.set('rp.tab',t);window.scrollTo(0,0)}
document.querySelectorAll('.tabbar button').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));

function renderAll(withMoves=true){renderGoal();renderToday();renderWeek();renderFood();renderLog();if(withMoves)renderMoves()}
fillForm();renderAll();showTab(store.get('rp.tab','plan'));
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
